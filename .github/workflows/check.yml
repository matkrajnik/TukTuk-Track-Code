name: Check
on:
  push:
  pull_request:
  # Ręczne uruchomienie z update_snapshots = true generuje wzorce zrzutów na
  # windows-latest i wysyła je jako artefakt `visual-snapshots` (zawartość do
  # skopiowania do tests/visual.spec.ts-snapshots i zacommitowania).
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Wygeneruj wzorce zrzutów na windows-latest (artefakt visual-snapshots)"
        type: boolean
        default: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium
      - name: Testy Playwright (bez zrzutów)
        run: npx playwright test --grep-invert @visual
      - name: Zrzuty wzorcowe
        if: ${{ !inputs.update_snapshots }}
        run: npm run test:visual
      - name: Nowe wzorce zrzutów
        if: ${{ inputs.update_snapshots }}
        run: npx playwright test tests/visual.spec.ts --update-snapshots=all
      - name: Artefakt z nowymi wzorcami
        if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: tests/visual.spec.ts-snapshots/
          retention-days: 14
      - name: Raport Playwright z różnicami zrzutów
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run tauri build -- --no-bundle
