# Workspace: aplikacja i domena Workflows (docs/workflows/PLAN_WDROZENIA.md, 6).
# default-members sprawia, że `cargo test --manifest-path src-tauri/Cargo.toml`
# testuje oba pakiety bez dodatkowych flag w CI i `npm run check`.
[workspace]
members = [".", "crates/workflow-core", "crates/agent-cli"]
default-members = [".", "crates/workflow-core", "crates/agent-cli"]

[package]
name = "tuktuk-track"
version = "2.5.1"
edition = "2021"
# Główny program aplikacji; `tuktuk-track-bridge` to host native messaging (W4).
default-run = "tuktuk-track"

[[bin]]
name = "tuktuk-track"
path = "src/main.rs"

# Host native messaging rozszerzenia przeglądarki (PLAN_1.7.md, W4); instalator NSIS
# dołącza go obok aplikacji.
[[bin]]
name = "tuktuk-track-bridge"
path = "src/bin/bridge.rs"

# Hook Claude Code i Codexa (PLAN_BACKLOG.md, B8); instalator dołącza go obok aplikacji.
[[bin]]
name = "tuktuk-track-hook"
path = "src/bin/hook.rs"

# Serwer MCP dla agentów (PLAN_BACKLOG.md, A2); instalator dołącza go obok aplikacji.
[[bin]]
name = "tuktuk-track-mcp"
path = "src/bin/mcp.rs"

# Sterowanie pomiarem z innych programów (zewnętrzne API, `api.rs`); instalator
# dołącza go obok aplikacji.
[[bin]]
name = "tuktuk-track-ctl"
path = "src/bin/ctl.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "rustls-tls-native-roots"] }
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-notification = "=2.5.0"
tauri-plugin-autostart = "=2.5.1"
auto-launch = "=0.5.0"
chrono = "0.4"
rust_xlsxwriter = "=0.99.1"
sha2 = "=0.10.9"
base64 = "=0.22.1"
getrandom = "=0.3.4"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Parser HTML formularza dnia Ideo Timesheet (PLAN_1.8.md, T1).
scraper = { version = "=0.27.0", default-features = false }
# Domena modułu Workflows bez zależności od Tauri (PLAN_WDROZENIA.md, 6).
workflow-core = { path = "crates/workflow-core" }
# Wspólna warstwa procesu i parserów CLI agentów (docs/workflows/E0_ANALIZA.md, decyzja E4).
agent-cli = { path = "crates/agent-cli" }
# Odczyt config.toml Codexa w preflighcie; wersja już obecna w Cargo.lock (E4).
toml = "=0.8.2"

[dev-dependencies]
chrono-tz = "=0.10.4"
calamine = "=0.36.1"
# Pomocnicy testów silnika (ScriptedRunner, MemoryRepository) tylko w testach hosta.
workflow-core = { path = "crates/workflow-core", features = ["testing"] }

[target.'cfg(windows)'.dependencies]
# Ta sama wersja, której używa notify-rust w tauri-plugin-notification 2.5.0;
# bezpośrednio, bo plugin nie przekazuje kliknięć ani przycisków na Windows.
tauri-winrt-notification = "=0.8.1"
# Ta sama wersja, której używa auto-launch: wpisy hosta native messaging w HKCU (W4).
winreg = "=0.10.1"
