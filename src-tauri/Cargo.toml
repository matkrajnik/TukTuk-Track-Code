[package]
name = "todo-track"
version = "1.7.2"
edition = "2021"
# Główny program aplikacji; `todo-track-bridge` to host native messaging (W4).
default-run = "todo-track"

[[bin]]
name = "todo-track"
path = "src/main.rs"

# Host native messaging rozszerzenia przeglądarki (PLAN_1.7.md, W4); instalator NSIS
# dołącza go obok aplikacji.
[[bin]]
name = "todo-track-bridge"
path = "src/bin/bridge.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-notification = "=2.5.0"
tauri-plugin-autostart = "=2.5.1"
auto-launch = "=0.5.0"
chrono = "0.4"
rust_xlsxwriter = "=0.99.1"
sha2 = "=0.10.9"
base64 = "=0.22.1"
getrandom = "=0.3.4"

[dev-dependencies]
chrono-tz = "=0.10.4"
calamine = "=0.36.1"

[target.'cfg(windows)'.dependencies]
# Ta sama wersja, której używa notify-rust w tauri-plugin-notification 2.5.0;
# bezpośrednio, bo plugin nie przekazuje kliknięć ani przycisków na Windows.
tauri-winrt-notification = "=0.8.1"
# Ta sama wersja, której używa auto-launch: wpisy hosta native messaging w HKCU (W4).
winreg = "=0.10.1"
